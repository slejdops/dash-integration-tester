version: '3.8'

services:
  ltpa-tester:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: ltpa-token-tester
    ports:
      - "5000:5000"
    environment:
      # DASH Configuration
      - DASH_URL=${DASH_URL:-https://localhost:9443}
      - DASH_ROLE_ENDPOINT=${DASH_ROLE_ENDPOINT:-/dash/api/roles}
      - VERIFY_SSL=${VERIFY_SSL:-false}

      # Flask Configuration
      - SECRET_KEY=${SECRET_KEY:-ltpa-test-secret-change-me}
      - DEBUG=${DEBUG:-false}
      - PORT=5000

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Restart policy
    restart: unless-stopped

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - ltpa-network

networks:
  ltpa-network:
    driver: bridge
